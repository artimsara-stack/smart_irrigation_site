<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Irrigation Dashboard</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>

<body>
<div class="container">

<header>
  <div class="title">
    <div class="logo"></div>
    <div>
      <h2>Smart Irrigation</h2>
      <div class="subtitle">ESP32 → MQTT → EMQX</div>
    </div>
  </div>

  <div class="actions">
    <div class="pill">
      <span class="dot" id="dot"></span>
      <span id="statusTxt">Connecting...</span>
    </div>
    <button class="btn" id="themeBtn" type="button">🌓 Theme</button>
    <button class="btn" id="clearBtn" type="button">🧹 Clear</button>
  </div>
</header>

<!-- KPIs -->
<div class="grid">

  <!-- 🔥 NEW CARD : Crop Selection -->
  <div class="card kpi">
    <div class="label">Culture (KPI)</div>

    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <select id="cropSelect" class="btn">
        <option value="tomato" selected>Tomates</option>
        <option value="berries">Fruits rouges</option>
      </select>

      <div class="pill">
        Actuel: <b id="cropLive">--</b>
      </div>
    </div>

    <div class="sub">Commande MQTT</div>
  </div>

  <!-- باقي الكروت ديالك بقاو نفسهم -->
  <!-- متبدلينش -->

</div>

<div class="charts">
  <div class="card chartCard">
    <div class="label">Air Temperature (°C)</div>
    <canvas id="cTemp"></canvas>
  </div>

  <div class="card chartCard">
    <div class="label">Soil (%)</div>
    <canvas id="cSoil"></canvas>
  </div>

  <div class="card chartCard">
    <div class="label">Wind (m/s)</div>
    <canvas id="cWind"></canvas>
  </div>

  <div class="card chartCard">
    <div class="label">Pressure (hPa)</div>
    <canvas id="cPress"></canvas>
  </div>

  <div class="card chartCard">
    <div class="label">ET0</div>
    <canvas id="cEdi"></canvas>
  </div>

  <div class="card chartCard">
    <div class="label">PPFD</div>
    <canvas id="cPpfd"></canvas>
  </div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
