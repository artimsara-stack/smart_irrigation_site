<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Smart Irrigation — Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>

<body>
<div class="container">

<header>
  <div>
    <h1>Smart Irrigation — Dashboard</h1>
    <div class="subtitle">ESP32 → MQTT → EMQX → GitHub Pages</div>
  </div>

  <div class="actions">
    <div class="live">
      <span class="dot" id="dot"></span>
      <span id="statusTxt">Connecting...</span>
    </div>
  </div>
</header>

<div class="grid">

  <div class="card">
    <h3>Air Temperature</h3>
    <div class="value"><span id="airT">--</span> °C</div>
  </div>

  <div class="card">
    <h3>Air Humidity</h3>
    <div class="value"><span id="airRH">--</span> %</div>
  </div>

  <div class="card">
    <h3>Soil Moisture</h3>
    <div class="value"><span id="soil">--</span> %</div>
  </div>

  <div class="card">
    <h3>Light (PPFD)</h3>
    <div class="value"><span id="ppfd">--</span></div>
  </div>

  <div class="card">
    <h3>Wind Speed</h3>
    <div class="value"><span id="wind">--</span> m/s</div>
  </div>

  <div class="card">
    <h3>Pressure</h3>
    <div class="value"><span id="pressure">--</span> hPa</div>
  </div>

  <div class="card control">
    <h3>Control Summary</h3>
    <div id="pumpBadge" class="pump off">PUMP OFF</div>
    <div class="mini">
      VPD: <span id="vpd">--</span> kPa
    </div>
    <div class="mini">
      ET0: <span id="et0">--</span> mm/h
    </div>
  </div>

</div>

<div class="charts">
  <div class="chartCard"><canvas id="tempChart"></canvas></div>
  <div class="chartCard"><canvas id="soilChart"></canvas></div>
  <div class="chartCard"><canvas id="windChart"></canvas></div>
  <div class="chartCard"><canvas id="pressChart"></canvas></div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
