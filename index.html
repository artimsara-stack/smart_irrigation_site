<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Irrigation Dashboard</title>

  <!-- ✅ CSS ديالك -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- App -->
  <script defer src="./app.js"></script>
</head>

<body>
  <div class="container">

    <header>
      <div class="title">
        <div class="logo"></div>
        <div>
          <h1 style="margin:0;font-size:18px;">Smart Irrigation — Dashboard</h1>
          <div class="subtitle">ESP32 → EMQX Cloud (MQTT) → GitHub Pages</div>
        </div>
      </div>

      <div class="actions">
        <div class="pill">
          <span class="dot" id="dot"></span>
          <span id="statusTxt">Connecting MQTT…</span>
        </div>
        <button class="btn" id="reconnectBtn">Reconnect</button>
      </div>
    </header>

    <!-- KPIs -->
    <section class="grid">
      <div class="card kpi">
        <div class="label">Air Temperature</div>
        <div class="value"><span id="airT">--</span> <span class="unit">°C</span></div>
        <div class="sub" id="timeLbl">Last update: --</div>
      </div>

      <div class="card kpi">
        <div class="label">Air Humidity</div>
        <div class="value"><span id="airRH">--</span> <span class="unit">%</span></div>
        <div class="sub">DHT22</div>
      </div>

      <div class="card kpi">
        <div class="label">Soil ADC</div>
        <div class="value"><span id="soil">--</span> <span class="unit">adc</span></div>
        <div class="sub">Raw analog value</div>
      </div>

      <div class="card kpi">
        <div class="label">Pump</div>
        <div class="value">
          <span class="badge off" id="pumpBadge"><span id="pumpTxt">PUMP OFF</span></span>
        </div>
        <div class="sub">From ESP32</div>
      </div>
    </section>

    <!-- Charts -->
    <section class="charts">
      <div class="card chartCard">
        <div class="label">Air Temperature (°C)</div>
        <canvas id="cTemp"></canvas>
      </div>

      <div class="card chartCard">
        <div class="label">Air Humidity (%)</div>
        <canvas id="cHum"></canvas>
      </div>

      <div class="card chartCard">
        <div class="label">Soil ADC</div>
        <canvas id="cSoil"></canvas>
      </div>

      <div class="card chartCard">
        <div class="label">Pump (ON=1 / OFF=0)</div>
        <canvas id="cPump"></canvas>
      </div>
    </section>

  </div>
</body>
</html>
